<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Addon</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: Arial, sans-serif;
            /* Detecta a preferência do celular (Modo Claro vs Escuro) */
            background-color: #ffffff;
            color: #333333;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
                color: #ffffff;
            }
        }

        /* Faixas Superior e Inferior */
        .faixa-lilas {
            width: 100%;
            height: 60px;
            background-color: #c8a2c8; /* Lilás */
            display: flex;
            align-items: center;
            padding: 0 15px;
        }

        .header {
            justify-content: flex-start;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-content span {
            font-size: 14px;
            font-weight: bold;
            color: #2b1b2b;
        }

        .header-content img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        /* Conteúdo Central */
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
            text-align: center;
        }

        /* Botão de Download */
        .btn-download {
            background-color: #800080; /* Roxo */
            color: #ffffff;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
            margin-bottom: 15px; /* Espaço entre o botão e o aviso */
        }

        .btn-download:hover {
            background-color: #6a006a;
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        /* Aviso abaixo do botão */
        .aviso {
            color: #000000; /* Preto no modo claro */
            opacity: 0.45;    /* 45% de opacidade */
            font-size: 13px;
            max-width: 300px;
            line-height: 1.4;
        }

        /* Ajusta o aviso para branco com 45% de opacidade no modo escuro para ficar legível */
        @media (prefers-color-scheme: dark) {
            .aviso {
                color: #ffffff;
            }
        }
    </style>
</head>
<body>

    <!-- Faixa Superior -->
    <header class="faixa-lilas header">
        <div class="header-content">
            <span>DOWNLOAD DO ADDON feito por KauzinhMagoh13 / Kraosz</span>
            <img src="iconMine.png" alt="Icone Minecraft" onerror="this.src='iconMine.jpg';">
        </div>
    </header>

    <!-- Centro da Página -->
    <main>
        <a href="content.mcaddon" download class="btn-download">
            guloso craft 1.4.6
        </a>
        <p class="aviso">AVISO: o arquivo do addon será baixado como mcaddon direto ou seja, não é nescessário mudar o zip, Então apenas inicie o arquivo com o Minecraft pelos os arquivos de download ou por Zarchiver</p>
    </main>

    <!-- Faixa Inferior -->
    <footer class="faixa-lilas"></footer>

</body>
</html>
