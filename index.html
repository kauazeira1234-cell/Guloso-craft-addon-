<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Addon - Guloso Craft</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            font-family: Arial, sans-serif;
            background-color: #ffffff;
            color: #333333;
            transition: background-color 0.3s, color 0.3s;
        }

        @media (prefers-color-scheme: dark) {
            body {
                background-color: #1a1a1a;
                color: #ffffff;
            }
        }

        /* Faixas Superior e Inferior */
        .faixa-lilas {
            width: 100%;
            min-height: 60px;
            background-color: #c8a2c8; /* Lilás */
            display: flex;
            align-items: center;
            padding: 10px 15px;
        }

        .header {
            justify-content: flex-start;
        }

        .header-content {
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-content span {
            font-size: 14px;
            font-weight: bold;
            color: #2b1b2b;
        }

        .header-content img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        /* Conteúdo Central */
        main {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            flex-grow: 1;
            padding: 20px;
            text-align: center;
        }

        /* Imagem de Showcase */
        .showcase-img {
            width: 100%;
            max-width: 300px; /* Tamanho máximo para não ficar gigante no PC */
            height: auto;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
            margin-bottom: 20px; /* Espaço entre a imagem e o botão */
            object-fit: cover;
        }

        /* Botão de Download */
        .btn-download {
            background-color: #800080; /* Roxo */
            color: #ffffff;
            padding: 15px 30px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            transition: transform 0.2s, background-color 0.2s;
            margin-bottom: 20px;
        }

        .btn-download:hover {
            background-color: #6a006a;
        }

        .btn-download:active {
            transform: scale(0.98);
        }

        /* Aviso abaixo do botão */
        .aviso {
            color: #000000;
            opacity: 0.5;
            font-size: 13px;
            max-width: 320px;
            line-height: 1.5;
        }

        @media (prefers-color-scheme: dark) {
            .aviso {
                color: #ffffff;
            }
        }
    </style>
</head>
<body>

    <!-- Faixa Superior -->
    <header class="faixa-lilas header">
        <div class="header-content">
            <span>DOWNLOAD DO ADDON por KauzinhMagoh13 / Kraosz</span>
            <img src="iconMine.png" alt="Ícone do Minecraft" onerror="this.src='iconMine.jpg';">
        </div>
    </header>

    <!-- Centro da Página -->
    <main>
        <!-- Imagem Showcase inserida aqui -->
        <img src="Showcase.png" alt="Showcase do Addon Guloso Craft" class="showcase-img">

        <a href="content.mcaddon" download class="btn-download">
            guloso craft 1.4.6
        </a>
        <p class="aviso"><strong>AVISO:</strong> O arquivo do addon será baixado diretamente em formato .mcaddon. Não é necessário alterar para .zip; basta iniciá-lo com o Minecraft pelos downloads ou gerenciadores de arquivos como o ZArchiver.</p>
    </main>

    <!-- Faixa Inferior -->
    <footer class="faixa-lilas"></footer>

</body>
</html>
